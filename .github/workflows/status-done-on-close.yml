name: status-done-on-close

on:
  issues:
    types: [closed]

jobs:
  set-done:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark closed issue done
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            const names = (issue.labels || []).map((label) => label.name)
            const statusLabels = names.filter((name) => name.startsWith('status:'))
            if (statusLabels.length === 1 && statusLabels[0] === 'status: done') {
              return
            }
            for (const name of statusLabels) {
              if (name === 'status: done') continue
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name,
                })
              } catch (error) {
                if (error.status !== 404) throw error
              }
            }
            if (!names.includes('status: done')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['status: done'],
              })
            }
