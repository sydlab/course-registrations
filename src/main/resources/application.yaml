spring:
  application:
    name: course-registrations
  datasource:
    jdbc-url: jdbc:mysql://localhost:3306/course_registrations?useSSL=false&allowPublicKeyRetrieval=true
    username: app_user
    password: ${COURSE_REG_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      initialization-fail-timeout: -1
